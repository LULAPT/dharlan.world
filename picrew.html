<!DOCTYPE html>
<html lang="pt-br">
	<head>
		<meta charset="UTF-8" />
		<script src="/assets/js/theme-init.js"></script>
		<script src="/assets/js/no-inspect.js"></script>
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="darkreader-lock" />
		<meta name="author" content="dharlan" />

		<title>dharlan</title>
		<link rel="icon" type="image/gif" href="/assets/img/favicon.gif" />

		<!-- CSS -->
		<link rel="stylesheet" href="/assets/css/style.css" />
		<link rel="stylesheet" href="/assets/css/picrew.css" />

		<!-- Fontes Externas -->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

		<!-- Script -->
		<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
	</head>

	<body>
		<div id="container">
			<header id="header-compacta"></header>
			<header id="header-mobile"></header>

			<main>
				<div id="nav-atual">
					<a href="/home/">home</a> >
					<a href="/utils/">utils</a> >
					<span class="animate-flicker">picrew</span>
				</div>
				<div id="col-centro">
					<h1>Picrew</h1>

					<!-- <p id="picrew-intro">
						Monte seu avatar anime. Roda em Flash, emulado no navegador —
						pode demorar um pouco pra carregar.
					</p> -->

					<div id="picrew-palco" class="permite-contexto">
						<div id="picrew-status">
							<p id="picrew-status-texto">Carregando o jogo...</p>
						</div>
					</div>

					<div id="picrew-barra" class="escondido">
						<button
							id="picrew-fullscreen"
							type="button"
							title="Tela cheia"
							aria-label="Tela cheia"
						>
							<svg id="picrew-fs-icone" viewBox="0 -960 960 960">
								<path
									d="M120-120v-240h80v160h160v80H120Zm480 0v-80h160v-160h80v240H600ZM120-600v-240h240v80H200v160h-80Zm640 0v-160H600v-80h240v240h-80Z"
								/>
							</svg>
						</button>
					</div>

					<div id="picrew-creditos">
						<em>Mega Anime Avatar Creator</em> por
						<a href="https://archive.org/download/rinmaru-dressup-games" target="_blank"
							>Rinmaru</a
						>
					</div>
				</div>
			</main>

			<footer></footer>
		</div>

		<script type="module" src="/assets/js/main.js"></script>

		<!-- Ruffle: emulador de Flash em WebAssembly. Vem de CDN pra não colocar
		     ~28MB de .wasm no repositório. -->
		<script src="https://cdn.jsdelivr.net/npm/@ruffle-rs/ruffle@0.6.0"></script>
		<script>
			(function () {
				const palco = document.getElementById("picrew-palco");
				const status = document.getElementById("picrew-status");
				const statusTexto = document.getElementById("picrew-status-texto");
				const barra = document.getElementById("picrew-barra");
				const btnFullscreen = document.getElementById("picrew-fullscreen");
				const iconePath = document.querySelector("#picrew-fs-icone path");

				const ICONE_ENTRAR =
					"M120-120v-240h80v160h160v80H120Zm480 0v-80h160v-160h80v240H600ZM120-600v-240h240v80H200v160h-80Zm640 0v-160H600v-80h240v240h-80Z";
				const ICONE_SAIR =
					"M240-120v-120H120v-80h200v200h-80Zm400 0v-200h200v80H720v120h-80ZM120-640v-80h120v-120h80v200H120Zm520 0v-200h80v120h120v80H640Z";

				// O site troca o title por um tooltip customizado
				// (jquery.style-my-tooltips.js): ele move o texto pra data-smt-title e
				// apaga o title. Se a gente reescrever el.title aqui, o tooltip nativo
				// volta por cima do customizado — então atualiza o dataset quando ele
				// já existir.
				function definirRotulo(el, texto) {
					el.setAttribute("aria-label", texto);
					if (typeof el.dataset.smtTitle !== "undefined") {
						el.dataset.smtTitle = texto;
					} else {
						el.title = texto;
					}
				}

				function falhar(motivo) {
					status.classList.remove("escondido");
					statusTexto.innerHTML =
						'<span class="aviso-erro">Não deu pra carregar o jogo aqui.</span><br />' +
						"Dá pra jogar direto no " +
						'<a href="https://www.dolldivine.com/classic-games/mega-anime-avatar-creator" target="_blank">site da Doll Divine</a>.';
					console.error("picrew:", motivo);
				}

				// A barra só aparece depois que o jogo carrega, e só se o navegador
				// deixar entrar em tela cheia.
				function prepararFullscreen(player) {
					if (!player.fullscreenEnabled) return;
					barra.classList.remove("escondido");

					function sincronizar() {
						const cheio = player.isFullscreen;
						iconePath.setAttribute("d", cheio ? ICONE_SAIR : ICONE_ENTRAR);
						definirRotulo(
							btnFullscreen,
							cheio ? "Sair da tela cheia" : "Tela cheia"
						);
					}

					btnFullscreen.addEventListener("click", function () {
						player.setFullscreen(!player.isFullscreen);
					});

					// Cobre também o ESC e o F11, que saem sem passar pelo botão.
					document.addEventListener("fullscreenchange", sincronizar);
					document.addEventListener("webkitfullscreenchange", sincronizar);
					sincronizar();
				}

				window.addEventListener("load", function () {
					// O script do Ruffle vem de CDN: se estiver fora do ar, o objeto
					// nem existe. Melhor avisar do que deixar um quadrado vazio.
					if (!window.RufflePlayer || !window.RufflePlayer.newest) {
						falhar("RufflePlayer indisponível (CDN fora do ar?)");
						return;
					}

					window.RufflePlayer.config = {
						autoplay: "on",
						// O menu do Ruffle traz qualidade, tela cheia e volume. O
						// no-inspect.js abre exceção pro clique direito aqui via a classe
						// .permite-contexto no #picrew-palco.
						contextMenu: "on",
						letterbox: "on",
						quality: "high",
						scale: "showAll",
						unmuteOverlay: "hidden",
						// Sem wmode: "transparent" de propósito. O palco do jogo é opaco,
						// e wmode transparente força composição por software (herança do
						// Flash), o que piora a suavização das curvas.
					};

					try {
						const player = window.RufflePlayer.newest().createPlayer();
						palco.appendChild(player);

						// O Ruffle monta a superfície de render UMA vez, dentro do load(),
						// a partir do tamanho que o elemento tiver naquele momento — e não
						// tem ResizeObserver pra refazer depois. Se load() rodar antes do
						// layout, ele cai no padrão do :host (550x400), e aí o canvas é
						// esticado por CSS até 900x650 (ou até 1920 em tela cheia), o que
						// serrilha tudo. Por isso: fixa o tamanho em px e só carrega no
						// frame seguinte, com o layout já resolvido.
						function dimensionar() {
							const r = palco.getBoundingClientRect();
							if (!r.width || !r.height) return false;
							player.style.width = Math.round(r.width) + "px";
							player.style.height = Math.round(r.height) + "px";
							return true;
						}

						dimensionar();
						requestAnimationFrame(function () {
							dimensionar();
							carregar();
						});

						function carregar() {
							player
								.load("/assets/swf/mega-anime-avatar-creator.swf")
								.then(function () {
									status.classList.add("escondido");
									prepararFullscreen(player);
								})
								.catch(function (e) {
									falhar(e);
								});
						}
					} catch (e) {
						falhar(e);
					}
				});
			})();
		</script>
	</body>
</html>
