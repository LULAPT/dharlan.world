<!DOCTYPE html>
<!-- data-sem-radio: a página tem trilha própria, então o rádio fica
     bloqueado aqui (ver radio-botao.js e o main.js).
     data-tema-fixo: o seletor de tema da engrenagem aparece travado, com
     este nome no lugar dos temas (ver settings-panel.js). -->
<html data-sem-radio data-tema-fixo="souls">
	<head>
		<meta charset="UTF-8" />
		<script src="/assets/js/theme-init.js"></script>
		<script src="/assets/js/no-inspect.js"></script>
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
		/>
		<meta name="darkreader-lock" />
		<meta name="author" content="dharlan" />
		<title>ｂｌａｃｋ　ｓｏｕｌｓ</title>
		<link rel="icon" type="image/gif" href="/assets/img/favicon.gif" />

		<!-- Esta página é autônoma, como a /galeria/arte/2kki/: não carrega o
		     style.css, só as variáveis, fontes e animações. O visual inteiro
		     mora aqui embaixo. -->
		<link rel="stylesheet" href="/assets/css/animations.css" />
		<link rel="stylesheet" href="/assets/css/fonts.css" />
		<link rel="stylesheet" href="/assets/css/variaveis.css" />

		<script type="module" src="/assets/js/main.js"></script>

		<style>
			:root {
				--b-radius: 0px;
				--clr-primaria: #e8e2e6;
				--clr-secundaria: #06060a;
				--clr-disabled: #7a1029;
			}

			* {
				image-rendering: pixelated !important;
				margin: 0;
				padding: 0;
			}

			::selection {
				background: var(--clr-primaria);
				color: var(--clr-secundaria);
			}

			body,
			html {
				background-color: var(--clr-secundaria);
				font-family: var(--fonte-corpo);
				font-size: 13px;
				height: 100%;
				overflow: hidden;
				width: 100%;
			}

			/* ----------------------------------------------
			 * Preloader — a entrada, igual à da /2kki/: nada toca antes de um
			 * clique, porque o autoplay de áudio exige gesto do usuário.
			 * ---------------------------------------------- */
			#preloader {
				align-items: center;
				background-color: var(--clr-secundaria);
				display: flex;
				height: 100%;
				justify-content: center;
				left: 0;
				position: fixed;
				top: 0;
				width: 100%;
				z-index: 100;
			}

			#preloader-content {
				display: flex;
				flex-direction: column;
				gap: 28px;
				align-items: center;
				text-align: center;
				z-index: 2;
			}

			#preloader-content .texto {
				color: var(--clr-primaria);
				font-size: 1.35em;
				line-height: 1.7em;
				max-width: 34ch;
				opacity: 0.85;
			}

			#play-button {
				background-color: transparent;
				border: 1px solid var(--clr-primaria);
				color: var(--clr-primaria);
				cursor: pointer;
				font-family: inherit;
				font-size: 1.1em;
				padding: 10px 32px;
				transition: background-color 0.25s, color 0.25s;
			}

			#play-button:hover {
				background-color: var(--clr-primaria);
				color: var(--clr-secundaria);
			}

			/* ----------------------------------------------
			 * Cenário — mesmo esquema da /2kki/: um WebP animado de fundo
			 * (feito do vídeo, a 15 fps), inteiro na tela, flutuando de leve.
			 * `contain` e não `cover`: o vídeo já tem as faixas pretas dos
			 * lados, e o cover cortaria as ilustrações.
			 * ---------------------------------------------- */
			#bg {
				animation: floating 6s ease-in-out infinite;
				background-color: var(--clr-secundaria);
				background-position: center;
				background-repeat: no-repeat;
				background-size: contain;
				filter: contrast(1.1) saturate(1.1);
				height: 100%;
				left: 0;
				opacity: 0;
				position: fixed;
				top: 0;
				transition: opacity 3s ease;
				width: 100%;
				z-index: 0;
			}

			#bg.visible {
				opacity: 1;
			}

			@keyframes floating {
				0%,
				100% {
					transform: translateY(0px);
				}
				50% {
					transform: translateY(-3px);
				}
			}

			/* A facada: aos 12s do vídeo há um corte seco pro preto e o som de
			   faca. A tela inteira (cenário e controles) dá um tranco ali. Em
			   steps, pra tremer seco, sem deslizar — no ritmo do resto do site. */
			body.facada {
				animation: facada 0.55s steps(1, end);
			}

			@keyframes facada {
				0% {
					transform: translate(-9px, 4px);
				}
				10% {
					transform: translate(8px, -6px);
				}
				20% {
					transform: translate(-7px, -3px);
				}
				30% {
					transform: translate(6px, 5px);
				}
				40% {
					transform: translate(-5px, 2px);
				}
				50% {
					transform: translate(4px, -4px);
				}
				60% {
					transform: translate(-3px, 3px);
				}
				70% {
					transform: translate(2px, -2px);
				}
				80% {
					transform: translate(-1px, 1px);
				}
				90%,
				100% {
					transform: translate(0, 0);
				}
			}

			/* Enquanto não há imagem de cenário, isto marca a área e deixa claro
			   que é placeholder. Some sozinho quando o #bg receber um
			   background-image. */
			#bg-aviso {
				align-items: center;
				color: var(--clr-primaria);
				display: flex;
				height: 100%;
				justify-content: center;
				left: 0;
				line-height: 1.8em;
				opacity: 0.35;
				position: fixed;
				text-align: center;
				top: 0;
				width: 100%;
				z-index: 1;
			}

			/* Vinheta por cima do cenário, pra dar profundidade e destacar os
			   controles. */
			#vinheta {
				background: radial-gradient(
					ellipse at center,
					transparent 35%,
					rgba(0, 0, 0, 0.55) 100%
				);
				height: 100%;
				left: 0;
				pointer-events: none;
				position: fixed;
				top: 0;
				width: 100%;
				z-index: 2;
			}

			/* ----------------------------------------------
			 * Controles
			 * ---------------------------------------------- */
			/* Em cima, como na /2kki/: o canto de baixo é da engrenagem e do
			   botão do rádio, que o main.js cria e que cobriam o "Voltar". */
			#controls {
				align-items: center;
				display: flex;
				gap: 8px;
				left: 20px;
				position: fixed;
				top: 20px;
				z-index: 10;
			}

			#controls button {
				background-color: var(--clr-secundaria);
				border: 1px solid #222;
				border-radius: var(--b-radius);
				color: var(--clr-primaria);
				cursor: pointer;
				font-family: inherit;
				font-size: 1em;
				padding: 6px 10px;
				transition: background-color 0.2s, color 0.2s;
			}

			#controls button:hover {
				background-color: #1a1a20;
			}

			.square-btn {
				align-items: center;
				display: flex;
				height: 30px;
				justify-content: center;
				width: 30px;
			}

			.square-btn svg {
				fill: var(--clr-primaria);
				height: 16px;
				width: 16px;
			}

			/* Volume: trilho fino e um quadradinho, no desenho dos botões. */
			/* Mesmo fundo e borda dos botões: sem isso o trilho some por cima
			   da ilustração. */
			#volume {
				-webkit-appearance: none;
				appearance: none;
				background-color: var(--clr-secundaria);
				border: 1px solid #222;
				box-sizing: border-box;
				cursor: pointer;
				height: 30px;
				margin: 0;
				padding: 0 10px;
				width: 120px;
			}

			#volume::-webkit-slider-runnable-track {
				background: rgba(232, 226, 230, 0.35);
				height: 2px;
			}

			#volume::-moz-range-track {
				background: rgba(232, 226, 230, 0.35);
				height: 2px;
			}

			#volume::-webkit-slider-thumb {
				-webkit-appearance: none;
				appearance: none;
				background: var(--clr-primaria);
				border: none;
				border-radius: 0;
				height: 12px;
				margin-top: -5px;
				width: 8px;
			}

			#volume::-moz-range-thumb {
				background: var(--clr-primaria);
				border: none;
				border-radius: 0;
				height: 12px;
				width: 8px;
			}

			#volume:focus-visible {
				outline: 1px solid var(--clr-primaria);
				outline-offset: 2px;
			}

			/* Engrenagem e rádio (criados pelo main.js) no desenho do GUI desta
			   página: sem fundo, ícone branco, borda #222 e o hover dos botões
			   daqui. O `:root` é pra ganhar do <style> que os módulos injetam
			   depois deste. */
			:root #settings-gear,
			:root #radio-botao {
				background: transparent;
				border: 1px solid #222;
				color: var(--clr-primaria);
				transition: background-color 0.2s;
			}

			:root #settings-gear:hover,
			:root #radio-botao:hover {
				background-color: #1a1a20;
			}

			:root #settings-gear span svg {
				fill: var(--clr-primaria);
			}

			/* O painel da engrenagem também no desenho do GUI: sem o rosa do tema
			   do site nos interruptores e na borda do seletor. */
			:root #settings-box {
				background: var(--clr-secundaria);
				border: 1px solid #222;
				color: var(--clr-primaria);
			}

			:root #settings-box label.switch-placeholder .slider {
				background: #2a2a30;
				border: 1px solid #333;
			}

			:root #settings-box label.switch-placeholder input:checked + .slider {
				background: var(--clr-primaria);
			}

			:root #settings-box label.switch-placeholder input:checked + .slider::before {
				background: var(--clr-secundaria);
			}

			:root #settings-box select,
			:root #settings-box select option {
				background: var(--clr-secundaria);
				border-color: #222;
				color: var(--clr-primaria);
			}

			:root #settings-box select:hover,
			:root #settings-box select:focus {
				border-color: #444;
			}

			/* O seletor travado tem regra própria no settings-panel.js, injetada
			   depois desta folha: precisa de mais peso pra seguir o #222. */
			:root #settings-box select:disabled {
				border-color: #222;
			}
		</style>
	</head>
	<body>
		<!-- Preloader -->
		<div id="preloader">
			<div id="preloader-content">
				<div class="texto">
					Toda alma que atravessa a floresta deixa alguma coisa para trás.
				</div>
				<button id="play-button">atravessar</button>
			</div>
		</div>

		<div id="controls">
			<button id="back-button" onclick="window.location.href='/galeria/arte/'">
				Voltar
			</button>
			<button
				id="mute-music"
				class="square-btn"
				onclick="alternarMudo()"
				title="Silenciar som"
			>
				<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960">
					<path
						d="M405.37-134.91q-62.27 0-105.88-43.62-43.62-43.61-43.62-105.88 0-62.27 43.62-105.89 43.61-43.61 105.88-43.61 18.31 0 34.88 4.78 16.58 4.78 31.62 12.35v-408.31h232.5v155h-149.5v385.68q0 62.27-43.62 105.88-43.61 43.62-105.88 43.62Z"
					/>
				</svg>
			</button>
			<input
				id="volume"
				type="range"
				min="0"
				max="100"
				value="15"
				aria-label="Volume"
				title="Volume: 15%"
			/>
		</div>

		<div id="bg"></div>
		<div id="bg-aviso">
			cenário ainda não definido<br />
			<small>defina CENARIO em black-souls.html</small>
		</div>
		<div id="vinheta"></div>

		<script>
			// ---------------------------------------------------------------
			// Ajustes — é aqui que a página é montada
			// ---------------------------------------------------------------

			// Imagem de fundo do cenário. Deixe vazio enquanto não houver uma;
			// a página mostra o aviso de placeholder no lugar.
			//
			// É um vídeo do jogo (BlackSouls.mp4, fora do repo: o .gitignore ignora
			// *.mp4) virado WebP animado no ffmpeg: até 87,8s, 15 fps, 960x540,
			// libwebp_anim quality 60, compression_level 6 e **loop 1**. O loop
			// 1 é o que faz ele tocar uma vez só e parar no último quadro — a
			// frase em vermelho no preto, nítida de 87,5s a 88s (o vídeo
			// original segue até 88,9s, com a frase sumindo; foi cortado antes
			// disso de propósito). Recomeça só com F5.
			var CENARIO = "/assets/img/black-souls.webp";

			// O roteiro, com os tempos do próprio vídeo, em ms desde que o
			// WebP começa a tocar. Se o WebP for refeito, confira:
			// 0s → 12,3s: a cena da Alice, com a música calma.
			// 12,0s: corte seco pro preto. 12,3s: o som da faca — a tela treme
			//        e a música da Alice morre junto.
			// 16,0s: o slideshow começa (o vídeo fica preto e mudo até lá) e
			//        entra o tema do jogo, que segue em loop depois que o
			//        vídeo para no fim.
			var FACADA_MS = 12300;
			var TEMA_MS = 16000;

			// Black Souls II OST (Alice Scene / Game Theme), regravadas em 128
			// kbps no ffmpeg — o original era 320. O som da faca é recortado do
			// vídeo (12,25s a 13,15s): o WebP não tem áudio. Vazio = sem.
			var MUSICA_ALICE = "/assets/wav/black-souls-alice.mp3";
			var MUSICA_TEMA = "/assets/wav/black-souls-tema.mp3";
			var FACADA_SOM = "/assets/wav/facada-black-souls.mp3";
			var VOLUME_MUSICA = 0.45;

			// ---------------------------------------------------------------

			var mudo = false;
			var reduzirMovimento = window.matchMedia(
				"(prefers-reduced-motion: reduce)"
			).matches;

			function dormir(ms) {
				return new Promise(function (resolve) {
					setTimeout(resolve, ms);
				});
			}

			// ---- cenário ---------------------------------------------------
			// O WebP começa a baixar já no preloader, mas só entra no #bg no
			// clique: um GIF/WebP animado começa a tocar quando é pintado pela
			// primeira vez, e é esse instante que serve de zero pro roteiro.
			// Se entrasse no #bg agora, ele já estaria rodando por baixo do
			// preloader (e, com loop 1, poderia até já ter acabado).
			var cenarioPronto = Promise.resolve();

			function aplicarCenario() {
				var aviso = document.getElementById("bg-aviso");
				if (!CENARIO) return;
				if (aviso) aviso.remove();
				var img = new Image();
				img.src = CENARIO;
				cenarioPronto = img.decode().catch(function () {});
			}

			// ---- áudio -----------------------------------------------------
			// As músicas são <audio> passando por um GainNode do Web Audio. O
			// gain é o que permite o fade e o mudo: no iOS o `volume` de um
			// <audio> é só leitura. Tudo é criado e destravado dentro do
			// clique — o tema só toca 16s depois, e o Safari/iOS recusaria um
			// play() tão longe do gesto (mesmo motivo do soco da /setup/ e dos
			// áudios do boot da /index/).
			var audioCtx = null;
			var mestre = null; // ganho geral, é ele que o botão de mudo zera
			var faixas = {}; // alice / tema: { el, ganho }
			var somFacada = null;

			function criarFaixa(src, emLoop) {
				var el = new Audio(src);
				el.preload = "auto";
				el.loop = emLoop;
				var faixa = { el: el, ganho: null };
				if (audioCtx) {
					try {
						faixa.ganho = audioCtx.createGain();
						faixa.ganho.gain.value = 0;
						audioCtx.createMediaElementSource(el).connect(faixa.ganho);
						faixa.ganho.connect(mestre);
					} catch (e) {
						faixa.ganho = null;
					}
				}
				// Destrava: play e pause ainda dentro do gesto do clique.
				var p = el.play();
				if (p && p.then) {
					p.then(function () {
						el.pause();
						el.currentTime = 0;
					}).catch(function () {});
				}
				return faixa;
			}

			function prepararAudio() {
				try {
					audioCtx = new (window.AudioContext || window.webkitAudioContext)();
					mestre = audioCtx.createGain();
					mestre.gain.value = ganhoGeral();
					mestre.connect(audioCtx.destination);
				} catch (e) {
					audioCtx = null;
				}
				if (MUSICA_ALICE) faixas.alice = criarFaixa(MUSICA_ALICE, false);
				if (MUSICA_TEMA) faixas.tema = criarFaixa(MUSICA_TEMA, true);

				if (audioCtx && FACADA_SOM) {
					fetch(FACADA_SOM)
						.then(function (r) {
							return r.arrayBuffer();
						})
						.then(function (buf) {
							return audioCtx.decodeAudioData(buf);
						})
						.then(function (decodificado) {
							somFacada = decodificado;
						})
						.catch(function () {});
				}
			}

			// Leva o ganho de uma faixa até `alvo` em `ms`. Sem Web Audio, cai
			// no volume do <audio>, sem fade.
			function rampa(faixa, alvo, ms) {
				if (faixa.ganho) {
					var g = faixa.ganho.gain;
					var agora = audioCtx.currentTime;
					g.cancelScheduledValues(agora);
					g.setValueAtTime(g.value, agora);
					g.linearRampToValueAtTime(alvo, agora + ms / 1000);
				} else {
					faixa.el.volume = alvo * ganhoGeral();
				}
			}

			function tocar(nome) {
				var faixa = faixas[nome];
				if (!faixa) return;
				try {
					faixa.el.currentTime = 0;
				} catch (e) {}
				rampa(faixa, VOLUME_MUSICA, 300);
				var p = faixa.el.play();
				if (p && p.catch) p.catch(function () {});
			}

			function parar(nome, ms) {
				var faixa = faixas[nome];
				if (!faixa) return;
				rampa(faixa, 0, ms);
				setTimeout(function () {
					faixa.el.pause();
				}, ms + 50);
			}

			function tocarFacada() {
				if (!audioCtx || !somFacada) return;
				try {
					var fonte = audioCtx.createBufferSource();
					fonte.buffer = somFacada;
					fonte.connect(mestre);
					fonte.start();
				} catch (e) {}
			}

			// ---- volume -----------------------------------------------------
			// O controle vai de 0 a 100 e começa em 15 (os sons eram altos
			// demais; já começou em 50 e em 25 e ainda estava alto). O ganho é
			// o quadrado do controle: o ouvido percebe volume em escala
			// logarítmica, e linear o começo do trilho mal baixaria nada —
			// assim 15 dá 0.0225 (~−33 dB) e a metade, 0.25 (~−12 dB). Vale pra
			// música e facada juntas: as duas passam pelo `mestre`. Mudando o
			// padrão, mude também o value="" do <input id="volume">.
			var volume = 0.15;

			function ganhoGeral() {
				return mudo ? 0 : volume * volume;
			}

			function aplicarGanho() {
				if (mestre) {
					// Rampa curta: mudar o ganho de uma vez estala.
					mestre.gain.setTargetAtTime(ganhoGeral(), audioCtx.currentTime, 0.02);
				} else {
					// Sem Web Audio: no volume de cada <audio>, onde ele existe.
					Object.keys(faixas).forEach(function (k) {
						faixas[k].el.muted = mudo;
						if (!faixas[k].el.paused) faixas[k].el.volume = VOLUME_MUSICA * volume * volume;
					});
				}
			}

			function pintarMudo() {
				var btn = document.getElementById("mute-music");
				btn.style.backgroundColor = mudo ? "var(--clr-disabled)" : "";
				// Tooltip do site: o texto mora no data-smt-title (ver CLAUDE.md).
				btn.dataset.smtTitle = mudo ? "Ativar som" : "Silenciar som";
			}

			function alternarMudo() {
				mudo = !mudo;
				aplicarGanho();
				pintarMudo();
			}

			var controleVolume = document.getElementById("volume");
			controleVolume.addEventListener("input", function () {
				volume = controleVolume.value / 100;
				// Mexer no volume com o som mudo tira o mudo, como em qualquer
				// player — senão a pessoa arrasta e não ouve nada.
				if (mudo && volume > 0) {
					mudo = false;
					pintarMudo();
				}
				var texto = "Volume: " + controleVolume.value + "%";
				if (typeof controleVolume.dataset.smtTitle !== "undefined") {
					controleVolume.dataset.smtTitle = texto;
				} else {
					controleVolume.title = texto;
				}
				aplicarGanho();
			});

			// ---- a facada --------------------------------------------------
			function facada() {
				// Corte seco, como o do vídeo — 60ms só pra não estalar.
				parar("alice", 60);
				tocarFacada();
				if (reduzirMovimento) return;
				var body = document.body;
				body.classList.remove("facada");
				void body.offsetWidth; // reinicia a animação se ainda estiver nela
				body.classList.add("facada");
			}

			document.body.addEventListener("animationend", function (e) {
				if (e.animationName === "facada") document.body.classList.remove("facada");
			});

			// ---- o roteiro --------------------------------------------------
			// Roda uma vez só, como o WebP. Cada passo é marcado a partir do
			// zero, não do passo anterior, pra os atrasos não se somarem.
			function rodarRoteiro(zero) {
				[
					{ ms: 0, faz: function () { tocar("alice"); } },
					{ ms: FACADA_MS, faz: facada },
					{ ms: TEMA_MS, faz: function () { tocar("tema"); } },
				].forEach(function (passo) {
					setTimeout(passo.faz, Math.max(0, zero + passo.ms - performance.now()));
				});
			}

			// ---- entrada ---------------------------------------------------
			document
				.getElementById("play-button")
				.addEventListener("click", async function () {
					var botao = this;
					prepararAudio(); // ainda dentro do gesto do clique

					// Se o WebP ainda não chegou, espera por ele (até 20s) com o
					// preloader na tela, pra não começar com o fundo vazio.
					botao.disabled = true;
					botao.textContent = "...";
					await Promise.race([cenarioPronto, dormir(20000)]);
					if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();

					document.getElementById("preloader").style.display = "none";

					await dormir(1200);
					var bg = document.getElementById("bg");
					if (CENARIO) bg.style.backgroundImage = 'url("' + CENARIO + '")';
					bg.classList.add("visible");
					// O WebP começa a tocar no quadro em que é pintado: o zero do
					// roteiro é o próximo quadro.
					requestAnimationFrame(function () {
						if (CENARIO) rodarRoteiro(performance.now());
						else tocar("alice");
					});
				});

			// Voltando pelo botão do navegador, o bfcache devolveria a página
			// parada no fim, sem roteiro e sem som. Recarrega e começa do
			// preloader, como um F5.
			window.addEventListener("pageshow", function (e) {
				if (e.persisted) location.reload();
			});

			aplicarCenario();
		</script>
	</body>
</html>
